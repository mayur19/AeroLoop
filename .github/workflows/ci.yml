name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: Lint (SwiftLint)
        run: swiftlint lint --reporter github-actions-logging

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project AeroLoop.xcodeproj \
            -scheme AeroLoop \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
