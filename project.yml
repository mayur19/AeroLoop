name: AeroLoop
options:
  bundleIdPrefix: com.greekerlabs
  deploymentTarget:
    macOS: "13.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.27.0
targets:
  AeroLoop:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources: [AeroLoop]
    dependencies:
      - package: GRDB
      - target: AeroLoopSaver
    postCompileScripts:
      - script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/PlugIns"
          cp -R "$TARGET_BUILD_DIR/AeroLoopSaver.saver" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/PlugIns/"
        name: Copy Screen Saver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greekerlabs.aeroloop
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        INFOPLIST_FILE: AeroLoop/Info.plist
        CODE_SIGN_ENTITLEMENTS: AeroLoop/Resources/AeroLoop.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: 5WDQX4W4GB

  AeroLoopSaver:
    type: bundle
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - AeroLoopSaver/AeroLoopSaverView.swift
      - AeroLoop/Core/VideoPlayerView.swift
      - AeroLoop/Models/WallpaperItem.swift
      - AeroLoop/Models/DisplayMode.swift
      - AeroLoop/Models/QualityMode.swift
      - AeroLoop/Services/SharedPaths.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greekerlabs.aeroloop.saver
        WRAPPER_EXTENSION: saver
        PRINCIPAL_CLASS: AeroLoopSaverView
        INFOPLIST_FILE: AeroLoopSaver/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AeroLoopSaver/AeroLoopSaver.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 5WDQX4W4GB
